name: AWS OIDC Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  oidc-check:
    name: Check AWS OIDC authentication
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::110735825932:role/ai-callcenter-poc-github-actions-role
          aws-region: eu-west-2

      - name: Check AWS identity
        run: aws sts get-caller-identity
